<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPC Manager</title>
</head>
<body>
  <h1>NPC Manager</h1>
  <form id="npcForm">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required><br>
    <label for="type">Type:</label>
    <select id="type" name="type" required>
      <option value="image">Image</option>
      <option value="spritesheet">Spritesheet</option>
    </select><br>
    <label for="img">Image URL:</label>
    <input type="text" id="img" name="img" required><br>
    <label for="scale">Scale:</label>
    <input type="number" id="scale" name="scale" required><br>
    <button type="submit">Add NPC</button>
  </form>

  <script>
    document.getElementById("npcForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const npcData = Object.fromEntries(formData.entries());
      npcData.scale = parseFloat(npcData.scale);

      const response = await fetch("http://localhost:4000/npc/npc", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(npcData),
      });

      const result = await response.json();
      alert(result.success ? "NPC added successfully!" : `Error: ${result.message}`);
    });
  </script>
</body>
</html>
